<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@600;800&family=Cormorant+SC:wght@500;700&family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<title>S^erap^S — визуальная новелла</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="game">
  <div id="bg" class="layer"></div>
  <div id="bg2" class="layer"></div>
  <canvas id="fx" class="layer"></canvas>
  <div id="chars" class="layer"></div>
  <div id="fxl" class="layer"></div>
  <div id="vignette" class="layer"></div>

  <div id="hud" class="hidden">
    <div id="chapter"></div>
  </div>
  <div id="toast"></div>

  <div id="side" class="hidden"><img alt=""></div>
  <div id="textbox" class="hidden">
    <div id="namebox"></div>
    <div id="text"></div>
    <div id="next"></div>
    <div id="controls">
      <button data-a="auto">Авто</button>
      <button data-a="skip">Пропуск</button>
      <button data-a="notes">Заметки</button>
      <button data-a="log">Журнал</button>
      <button data-a="save">Сохр.</button>
      <button data-a="load">Загр.</button>
      <button data-a="menu">Меню</button>
    </div>
  </div>

  <div id="choices" class="hidden"></div>

  <div id="pixwrap" class="layer hidden">
    <canvas id="pix" width="320" height="180"></canvas>
    <div id="pixHud"><div><div id="pixDay"></div><div id="pixTask"></div></div>
      <div class="pixBtns"><button id="pixNotes">Заметки</button><button id="pixSave">Сохр.</button><button id="pixMenu">Меню</button></div></div>
    <div id="pixPrompt"></div>
    <div id="pixHelp">WASD / стрелки — идти · Shift — бегом · E или клик — войти · N — заметки</div>
  </div>

  <div id="cut" class="layer hidden"><div class="cstage"><div class="cimg"></div><div class="cimg"></div></div><div class="ccap"></div></div>
  <div id="card" class="layer hidden"><div class="cBig"></div><div class="cLine"></div><div class="cSmall"></div></div>

  <div id="title" class="screen">
    <div id="tAnim"><img class="tf on" data-f="t0" alt=""><img class="tf" data-f="t1" alt=""><img class="tf" data-f="t2" alt=""><img class="tf" data-f="tb" alt=""></div>
    <div class="tShade"></div>
    <canvas id="tDust"></canvas>
    <div class="logo"><img id="logoImg" alt=""><div class="logoText">S^erap^S</div></div>
    <nav class="bar">
      <button class="vbtn" id="btnNew">Новая игра</button>
      <button class="vbtn" id="btnContinue">Продолжить</button>
      <button class="vbtn" id="btnLoadT">Загрузить</button>
      <button class="vbtn" id="btnEndings">Концовки</button>
      <button class="vbtn" id="btnSettings">Настройки</button>
    </nav>
    <div class="madeby">Made By Sora</div>
  </div>

  <div id="nameScreen" class="screen hidden">
    <div class="panel">
      <h2>Как тебя зовут?</h2>
      <input id="nameInput" maxlength="16" placeholder="Кирилл">
      <button id="nameOk">Начать</button>
    </div>
  </div>

  <div id="modal" class="screen hidden"><div class="panel" id="modalBody"></div></div>

  <div id="ending" class="screen hidden">
    <div class="panel">
      <h2 id="endTitle"></h2>
      <p id="endText"></p>
      <button id="endBack">В главное меню</button>
      <div class="madeby">Made By Sora</div>
    </div>
  </div>
</div>
<script src="assets/sera1.js"></script>
<script src="assets/sera2.js"></script>
<script src="assets/sera3.js"></script>
<script src="assets/sera4.js"></script>
<script src="assets/sprites2.js"></script>
<script src="assets/sprites6.js"></script>
<script src="assets/anim1.js"></script>
<script src="assets/anim2.js"></script>
<script src="assets/anim3.js"></script>
<script src="assets/npc1.js"></script>
<script src="assets/title.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/bg1.js"></script>
<script src="assets/bg2.js"></script>
<script src="assets/bg3.js"></script>
<script src="assets/bg4.js"></script>
<script src="assets/cg1.js"></script>
<script src="assets/cg2.js"></script>
<script src="assets/cg3.js"></script>
<script src="assets/cg4.js"></script>
<script src="assets/cg5.js"></script>
<script src="assets/music1.js"></script>
<script src="assets/music2.js"></script>
<script src="assets/music3.js"></script>
<script src="assets/music4.js"></script>
<script src="assets/music5.js"></script>
<script src="assets/music6.js"></script>
<script src="assets/music7.js"></script>
<script src="assets/music8.js"></script>
<script src="assets/music9.js"></script>
<script src="assets/music10.js"></script>
<script src="assets/sfx.js"></script>
<script src="js/audio.js"></script>
<script src="js/story.js"></script>
<script src="js/pixel.js"></script>
<script src="js/engine.js"></script>
</body>
</html>
